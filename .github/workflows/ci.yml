name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  pull_request:

# Superseded PR runs are cancelled; every merged main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: Check release metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import yaml

          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          plugin = yaml.safe_load((root / 'plugin.yaml').read_text())
          assert project['version'] == plugin['version'], 'pyproject and plugin versions differ'
          assert project['name'] == 'musubi-hermes'
          assert plugin['name'] == 'musubi'
          PY
      - run: python -m pytest -q
      - run: python tests/test_lease_contention.py
      - run: python tests/test_upgrade_and_recovery.py
