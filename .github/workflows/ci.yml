name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: Check release metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          import yaml

          root = pathlib.Path('.')
          project = tomllib.loads((root / 'pyproject.toml').read_text())['project']
          plugin = yaml.safe_load((root / 'plugin.yaml').read_text())
          assert project['version'] == plugin['version'], 'pyproject and plugin versions differ'
          assert project['name'] == 'musubi-hermes'
          assert plugin['name'] == 'musubi'
          PY
      - run: python -m pytest -q
      - run: python tests/test_lease_contention.py
      - run: python tests/test_upgrade_and_recovery.py
