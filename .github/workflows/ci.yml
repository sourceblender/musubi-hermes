name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q
      - run: python tests/test_lease_contention.py
      - run: python tests/test_upgrade_and_recovery.py
